[SERVICE]
    # 버퍼에 쌓인 데이터를 OUTPUT으로 내보내는 주기 (초)
    Flush        1
    # 백그라운드 데몬 실행 여부 - 컨테이너 환경에서는 반드시 Off
    Daemon       Off
    # Fluent Bit 자체 로그 레벨
    Log_Level    info
    # 파서 정의 파일의 경로
    Parsers_File parsers.conf
    # tail 플러그인의 오프셋 저장 DB - 재시작해도 중복 수집 방지
    DB           /var/log/app/fluent-bit-tail.db

[INPUT]
    # 플러그인 종류: 파일을 tail -f 처럼 실시간 추적
    Name             tail
    # Spring Boot에서 생성하는 JSON 로그 파일의 컨테이너 내부 경로
    Path             /var/log/app/*.log
    # 정의한 파서로 각 줄을 해석
    Parser           json_log
    # 이 데이터 스트림에 붙일 태그명 (라우팅용 바코드 역할)
    Tag              platform.backend
    # 새 파일 생성 감지 주기 (초)
    Refresh_Interval 5
    # INPUT 버퍼 최대 크기
    Mem_Buf_Limit    5MB
    # 버퍼 초과하는 긴 줄은 건너뜀 (파이프라인 멈춤 방지)
    Skip_Long_Lines  On

[FILTER]
    Name         record_modifier
    Match        *
    # log 필드 제거 - Docker/K8s가 자동으로 붙이는 중복 필드
    Remove_key   log

# 운영 환경
# [OUTPUT]
#     Name            kinesis_firehose
#     Match           *
#     region          ap-northeast-2
#     delivery_stream your-firehose-stream-name

# 개발 환경
[OUTPUT]
    Name   stdout
    Match  *

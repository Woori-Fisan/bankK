spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: agency-platform

  ai:
    google:
      genai:
        project-id: ${GOOGLE_CLOUD_PROJECT_ID}
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite-preview
        embedding:
          project-id: ${GOOGLE_CLOUD_PROJECT_ID}
          api-key: ${GOOGLE_AI_API_KEY}
          options:
            model: gemini-embedding-001

  mvc:
    async:
      # SSE 연결이 최대 60초 유지되므로 그보다 긴 65초로 설정.
      request-timeout: 65000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:1379}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: always   # 운영 전환 시 never로 변경
      baseline-on-migrate: true

  # Spring AI — Gemini (Vertex AI)
#  ai:

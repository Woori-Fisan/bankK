#      ai:
#        gemini:
#          project-id: ${GCP_PROJECT_ID}
#          location: us-central1
#          chat:
#            options:
#              model: gemini-1.5-pro
#          embedding:
#            options:
#              model: text-embedding-004
#    vectorstore:
#      qdrant:
#        host: ${QDRANT_HOST:localhost}
#        port: ${QDRANT_PORT:6334}
#        collection-name: agency-docs
#        initialize-schema: true

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.platform
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:tempJWTkeyForBankBridgeDevelopmentEnvironment123!}
  access-expiration: 600000       # 10분 (ms)
  refresh-expiration: 3600000    # 1시간 (ms)

# mTLS 인증서 경로
#mtls:
#  keystore-path: ${MTLS_KEYSTORE_PATH}
#  keystore-password: ${MTLS_KEYSTORE_PASSWORD}
#  truststore-path: ${MTLS_TRUSTSTORE_PATH}
#  truststore-password: ${MTLS_TRUSTSTORE_PASSWORD}

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

qdrant:
  host: localhost
  port: 6334

# 로깅
logging:
  config: classpath:logback-spring.xml

  file:
    path: ${LOG_PATH:./logs}

bank:
  core:
    url: ${BANK_SERVER_URL:http://localhost:8081}
    endpoints:
      evaluation-terms: "/api/v1/loan/evaluation/terms"
      evaluation: "/api/v1/loan/evaluation"
      contract-terms: "/api/v1/loan/contract/terms"
      execution: "/api/v1/loan/execution"
  webhook:
    # [신규] Bank → Platform 콜백 요청 헤더(X-Webhook-Secret)의 인증 비밀키.
    # Bank와 Platform 양쪽에서 동일한 WEBHOOK_SECRET 환경변수를 설정해야 검증이 통과된다.
    secret: ${WEBHOOK_SECRET:dev-secret}
  urls:
    "020":
      base-url: ${WOORI_BASE_URL:http://localhost:8081/api/v1/baas}
      endpoints:
        balance: "/account/balance"
        history: "/account/transactions"
        withdraw: "/transfer/withdraw"
        withdrawal: "/transfer/withdrawal"
        deposit: "/transfer/deposit"
        recipient: "/transfer/recipient"
        refund: "/transfer/refund"
        transfer: "/transfer"
        public-key: "/keys/public"
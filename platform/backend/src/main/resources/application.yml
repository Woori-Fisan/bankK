server:
  port: ${PLATFORM_BACKEND_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  application:
    name: agency-platform

  ai:
    google:
      genai:
        project-id: ${GOOGLE_CLOUD_PROJECT_ID}
        api-key: ${GOOGLE_AI_API_KEY}
        chat:
          options:
            model: gemini-3.1-flash-lite-preview
        embedding:
          project-id: ${GOOGLE_CLOUD_PROJECT_ID}
          api-key: ${GOOGLE_AI_API_KEY}
          options:
            model: gemini-embedding-001

  mvc:
    async:
      # SSE 연결이 최대 120초 유지되므로 그보다 긴 125초로 설정.
      request-timeout: 125000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:1379}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: always   # 운영 전환 시 never로 변경
      baseline-on-migrate: true

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.platform
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:tempJWTkeyForBankBridgeDevelopmentEnvironment123!}
  access-expiration: 600000       # 10분 (ms)
  refresh-expiration: 3600000    # 1시간 (ms)

# mTLS 인증서 경로
#mtls:
#  keystore-path: ${MTLS_KEYSTORE_PATH}
#  keystore-password: ${MTLS_KEYSTORE_PASSWORD}
#  truststore-path: ${MTLS_TRUSTSTORE_PATH}
#  truststore-password: ${MTLS_TRUSTSTORE_PASSWORD}

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

qdrant:
  host: localhost
  port: 6334

# 로깅
logging:
  config: classpath:logback-spring.xml

  file:
    path: ${LOGGING_PATH:./logs}


spring:
  profiles:
    active: local
  application:
    name: agency-platform

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:1379}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: always   # 운영 전환 시 never로 변경
      baseline-on-migrate: true

  # Spring AI — Gemini (Vertex AI)

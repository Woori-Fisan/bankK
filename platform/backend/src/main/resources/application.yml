#          location: us-central1
#          chat:
#            options:
#              model: gemini-1.5-pro
#          embedding:
#            options:
#              model: text-embedding-004
#    vectorstore:
#      qdrant:
#        host: ${QDRANT_HOST:localhost}
#        port: ${QDRANT_PORT:6334}
#        collection-name: agency-docs
#        initialize-schema: true

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.platform
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET:tempJWTkeyForBankBridgeDevelopmentEnvironment123!}
  access-expiration: 900000       # 15분 (ms)
  refresh-expiration: 28800000    # 8시간 (ms)

# mTLS 인증서 경로
#mtls:
#  keystore-path: ${MTLS_KEYSTORE_PATH}
#  keystore-password: ${MTLS_KEYSTORE_PASSWORD}
#  truststore-path: ${MTLS_TRUSTSTORE_PATH}
#  truststore-password: ${MTLS_TRUSTSTORE_PASSWORD}

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 로깅
logging:
  config: classpath:logback-spring.xml

bank:
  core:
    url: ${BANK_SERVER_URL:http://localhost:8081}
  urls:
    "020":
      base-url: ${WOORI_BASE_URL:http://localhost:8081/api/v1/baas}
      endpoints:
        balance: "/account/balance"
        history: "/account/transactions"
        withdraw: "/transfer/withdrawal"
        deposit: "/transfer/deposit"
        recipient: "/transfer/recipient"
        transfer: "/transfer"
    "004":
      base-url: ${KB_BASE_URL:http://localhost:8082/api/v1/baas}
      endpoints:
        balance: "/account/balance"
        history: "/account/transactions"
        withdraw: "/transfer/withdrawal"
        deposit: "/transfer/deposit"
        recipient: "/transfer/recipient"
        transfer: "/transfer"
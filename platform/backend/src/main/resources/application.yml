spring:
  profiles:
    active: local
  application:
    name: agency-platform

  # DB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Spring Batch
  batch:
    jdbc:
      initialize-schema: always   # 운영 전환 시 never로 변경

  # Spring AI — Gemini (Vertex AI)
#  ai:
#    vertex:
#      ai:
#        gemini:
#          project-id: ${GCP_PROJECT_ID}
#          location: us-central1
#          chat:
#            options:
#              model: gemini-1.5-pro
#          embedding:
#            options:
#              model: text-embedding-004
#    vectorstore:
#      qdrant:
#        host: ${QDRANT_HOST:localhost}
#        port: ${QDRANT_PORT:6334}
#        collection-name: agency-docs
#        initialize-schema: true

# MyBatis
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.platform
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000       # 15분 (ms)
  refresh-expiration: 28800000    # 8시간 (ms)

# mTLS 인증서 경로
#mtls:
#  keystore-path: ${MTLS_KEYSTORE_PATH}
#  keystore-password: ${MTLS_KEYSTORE_PASSWORD}
#  truststore-path: ${MTLS_TRUSTSTORE_PATH}
#  truststore-password: ${MTLS_TRUSTSTORE_PASSWORD}

# Actuator / Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 로깅
logging:
  config: classpath:logback-spring.xml
name: 🐛 버그
description: 버그를 발견했을 때 사용하세요.
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: 모듈
      options: [platform, bank, monitoring, common]
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 어떤 버그인가요?
      placeholder: "예: 계좌 조회 시 500 에러 발생"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      placeholder: "정상적으로 조회가 되어야 함"

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 에러 메시지
      render: shell
name: Platform Backend Deploy Prod

on:
  push:
    branches:
      - develop

    paths:
      - 'platform/backend/**'
      - '.github/workflows/platform-backend-deploy-prod.yml'

concurrency:
  group: platform-backend-deploy-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Set .env
      # --------------------------------------------------

      - name: Create env file
        working-directory: platform/backend
        run: |
          echo "${{ secrets.PLATFORM_BACKEND_ENV_TEST }}" > .env

      - name: Export env variables
        working-directory: platform/backend
        run: |
          grep -v '^#' .env | grep -v '^$' >> $GITHUB_ENV

      # --------------------------------------------------
      # Java Setup
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------
      # DockerHub Login
      # --------------------------------------------------

      - name: DockerHub Login
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # Gradle Permission
      # --------------------------------------------------

      - name: Grant Gradle Execute Permission
        working-directory: platform/backend

        run: chmod +x ./gradlew

      # --------------------------------------------------
      # SonarQube + Coverage
      # --------------------------------------------------

      - name: SonarQube Scan
        working-directory: platform/backend

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN

      # --------------------------------------------------
      # Extract SHA
      # --------------------------------------------------

      - name: Extract Short SHA
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # --------------------------------------------------
      # Docker Build & Push
      # --------------------------------------------------

      - name: Build & Push with Jib
        working-directory: platform/backend

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          ./gradlew jib \
            -PbuildNumber=$SHORT_SHA
          
      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # --------------------------------------------------
      # SSH Key Setup
      # --------------------------------------------------

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.PROD_BASTION_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # --------------------------------------------------
      # Deploy
      # --------------------------------------------------

      - name: Deploy to Platform Server
        run: |
          echo "Deploying image: $SHORT_SHA"

          ssh -o StrictHostKeyChecking=no \
            -i key.pem \
            ubuntu@${{ secrets.PROD_BASTION_HOST }} \
            "ssh -o StrictHostKeyChecking=no \
            -i bankk-private-key.pem \
            ubuntu@${{ secrets.PROD_PLATFORM_RUNTIME_HOST }} \
            /home/ubuntu/platform-backend/deploy.sh $SHORT_SHA"

          echo "Platform deployment completed."

      # --------------------------------------------------
      # Update SSM Image Tag
      # --------------------------------------------------

      - name: Update SSM Image Tag
        run: |
          aws ssm put-parameter \
            --region ap-northeast-2 \
            --name "/bankk/platform/backend/image-tag" \
            --value "$SHORT_SHA" \
            --type String \
            --overwrite
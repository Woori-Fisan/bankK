name: Platform Frontend Deploy Prod

on:
  push:
    branches:
      - develop

    paths:
      - 'platform/frontend/**'
      - '.github/workflows/platform-frontend-deploy-prod.yml'

concurrency:
  group: platform-frontend-deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/frontend

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node Setup
      # --------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'platform/frontend/.nvmrc'
          cache: npm
          cache-dependency-path: platform/frontend/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.6.2

      # --------------------------------------------------
      # Install Dependencies
      # --------------------------------------------------

      - name: Install Dependencies
        run: npm ci

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build Frontend
        run: npm run build

      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # --------------------------------------------------
      # Upload Dist To S3
      # --------------------------------------------------

      - name: Upload Dist To S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.PLATFORM_S3_BUCKET_NAME }} \
            --delete

      # --------------------------------------------------
      # Invalidate CloudFront Cache
      # --------------------------------------------------

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.PLATFORM_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
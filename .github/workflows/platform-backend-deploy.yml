name: Platform BaaS CI/CD Pipeline

on:
  push:
    branches: [ develop ] # develop 브랜치에 코드가 push/merge 되면 작동

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # GitHub-hosted runner 엔진 사용
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v3

      - name: Java JDK 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Jib를 이용한 빌드 및 Docker Hub 푸시
        working-directory: platform/backend
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew jib \
            -Djib.to.image=docker.io/aransword/platform_backend:${{ github.run_number }} \
            -Djib.to.auth.username=$DOCKER_USER \
            -Djib.to.auth.password=$DOCKER_PASS \
            -Djib.to.tags=latest
      - name: OpenStack 서버 원격 접속 및 배포 스크립트 실행
        uses: appleboy/ssh-action@master
        with:
          host: 172.21.33.227
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 서버 내부의 deploy.sh 파일이 있는 경로로 이동하여 실행
            cd /home/ubuntu
            chmod +x deploy.sh
            ./deploy.sh ${{ github.run_number }}
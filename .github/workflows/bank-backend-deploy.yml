name: Bank Backend Deploy

on:
  push:
    branches:
      - develop

    paths:
      - 'bank/backend/**'
      - '.github/workflows/bank-backend-deploy.yml'

concurrency:
  group: bank-backend-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Set .env
      # --------------------------------------------------

      - name: Create env file
        working-directory: bank/backend
        run: |
          echo "${{ secrets.BANK_BACKEND_ENV_TEST }}" > .env

      - name: Export env variables
        working-directory: bank/backend
        run: |
          grep -v '^#' .env | grep -v '^$' >> $GITHUB_ENV

      # --------------------------------------------------
      # Java Setup
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------
      # Configure AWS Credentials
      # --------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # --------------------------------------------------
      # ECR Login
      # --------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------
      # Gradle Permission
      # --------------------------------------------------

      - name: Grant Gradle Execute Permission
        working-directory: bank/backend

        run: chmod +x ./gradlew

      # --------------------------------------------------
      # SonarQube + Coverage
      # --------------------------------------------------

      - name: SonarQube Scan
        working-directory: bank/backend

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN


      # --------------------------------------------------
      # Extract SHA
      # --------------------------------------------------

      - name: Extract Short SHA
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # --------------------------------------------------
      # Docker Build & Push
      # --------------------------------------------------

      - name: Build & Push with Jib
        working-directory: bank/backend

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          ./gradlew jib \
            -PbuildNumber=$SHORT_SHA  

      # --------------------------------------------------
      # SSH Key Setup
      # --------------------------------------------------

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # --------------------------------------------------
      # Deploy
      # --------------------------------------------------

      - name: Deploy to Runtime Servers
        run: |
          FAILED=0

          for HOST in \
            "${{ secrets.BANK_RUNTIME_HOST_WOORI }}" \
            "${{ secrets.BANK_RUNTIME_HOST_SHINHAN }}" \
            "${{ secrets.BANK_RUNTIME_HOST_KB }}"
          do
            echo "Deploying to ${HOST}..."

            ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.BASTION_PORT }} \
              -i key.pem \
              ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} \
              "ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/Bank-Key.pem \
              ubuntu@${HOST} \
              '/home/ubuntu/bank/deploy.sh'" \
            || FAILED=1
          done

          exit $FAILED
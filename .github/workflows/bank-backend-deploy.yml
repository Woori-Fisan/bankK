name: Bank Backend Deploy

on:
  push:
    branches:
      - develop

    paths:
      - 'bank/backend/**'
      - '.github/workflows/bank-backend-deploy.yml'

concurrency:
  group: bank-backend-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # Set .env
      # --------------------------------------------------

      - name: Create env file
        working-directory: bank/backend
        run: |
          echo "${{ secrets.BANK_BACKEND_ENV_TEST }}" > .env

      # --------------------------------------------------
      # Java Setup
      # --------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          java-version: '17'
          distribution: 'temurin'

      # --------------------------------------------------
      # DockerHub Login
      # --------------------------------------------------

      - name: DockerHub Login
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # Gradle Permission
      # --------------------------------------------------

      - name: Grant Gradle Execute Permission
        working-directory: bank/backend

        run: chmod +x ./gradlew

      # --------------------------------------------------
      # SonarQube + Coverage
      # --------------------------------------------------

      - name: SonarQube Scan
        working-directory: bank/backend

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        run: |
          ./gradlew test jacocoTestReport sonarqube \
            -Dspring.profiles.active=test \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.token=$SONAR_TOKEN


      # --------------------------------------------------
      # Extract SHA
      # --------------------------------------------------

      - name: Extract Short SHA
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV

      # --------------------------------------------------
      # Docker Build & Push
      # --------------------------------------------------

      - name: Build & Push with Jib
        working-directory: bank/backend

        env:
          DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          ./gradlew jib \
            -PbuildNumber=$SHORT_SHA

      # --------------------------------------------------
      # SSH Key Setup
      # --------------------------------------------------

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.BASTION_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      # --------------------------------------------------
      # Deploy
      # --------------------------------------------------

      - name: Deploy to Runtime Server
        run: |
          ssh -o StrictHostKeyChecking=no \
            -p ${{ secrets.BASTION_PORT }} \
            -i key.pem \
            ${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }} \
            "ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/Bank-Key.pem \
            ubuntu@${{ secrets.BANK_RUNTIME_HOST }} \
            '/home/ubuntu/bank/deploy.sh'"
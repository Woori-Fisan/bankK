server:
  port: ${BANK_SERVER_PORT:8082}

spring:
  application:
    name: monitoring-collector

  # ── DB (MySQL) ──────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:1379}
    driver-class-name: com.mysql.cj.jdbc.Driver

# ── MyBatis ──────────────────────────────────────
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.monitoring
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ── JWT ──────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:tempJWTkeyForBankBridgeDevelopmentEnvironment123!}
  access-expiration: 900000       # 15분 (ms)
  refresh-expiration: 28800000    # 8시간 (ms)

# ── Actuator / Prometheus (Observability) ────────
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info, metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}


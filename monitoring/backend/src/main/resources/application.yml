server:
  port: ${MONITORING_BACKEND_PORT:8082}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

spring:
  application:
    name: monitoring-collector

  # ── DB (MySQL) ──────────────────────────────────
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:platform_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASS:1379}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ── MyBatis ──────────────────────────────────────
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.woorifisan.monitoring
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ── JWT ──────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:tempJWTkeyForBankKDevelopmentEnvironment123!}
  access-expiration: 900000       # 15분 (ms)
  refresh-expiration: 28800000    # 8시간 (ms)

# Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
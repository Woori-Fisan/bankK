global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: platform-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - PLATFORM_BACKEND_HOST:PLATFORM_BACKEND_PORT
    relabel_configs:
      - target_label: application
        replacement: platform-backend